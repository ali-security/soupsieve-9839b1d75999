name: deploy

on:
  workflow_dispatch:

jobs:

  pypi:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      PIP_INDEX_URL: https://:2023-04-16@time-machines-pypi.sealsecurity.io/

    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-python@v4
        with:
          python-version: 3.9
      - name: Package
        run: |
          pip install --upgrade build
          printf 'hatchling==1.14.0\n' > "${RUNNER_TEMP}/constraints.txt"
          PIP_CONSTRAINT="${RUNNER_TEMP}/constraints.txt" python -m build -s -w
      - name: Upload distributions
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/*
          if-no-files-found: error
